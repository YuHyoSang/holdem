<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>홀덤 퀴즈</title>
<meta name="theme-color" content="#0b4730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="홀덤 퀴즈">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* VOICE: 카드룸의 딜러처럼 짧고 분명하게
   IDEA: 펠트 테이블 위에 카드가 깔리고 칩 버튼으로 답한다
   PICTURE: 문제마다 실제 카드가 테이블에 놓인 모습
   COLOUR and TYPE: 펠트 그린 바탕, 흰 카드, 칩 레드 강조 / 시스템 한글 산세리프
   LAYOUT: 한 손 세로 화면, 위 점수판, 가운데 테이블, 아래 답 버튼 */
:root{--felt:#0f5a3c;--felt2:#0b4730;--rail:#08331f;--ink:#f3f6f1;--mute:#b9cfc1;--card:#fffdf8;--red:#d23a3a;--blk:#1b1b1b;--ok:#3fcf7a;--bad:#ee5a5a;--gold:#f3c44f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:#0b4730}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 30%,var(--felt),var(--felt2) 70%,var(--rail)) fixed;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:24px;line-height:1.05;margin:0;font-weight:900;letter-spacing:-.5px}
h1 span{color:var(--gold)}
.modes{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:999px;padding:4px}
h1{margin-right:auto!important}
.modes button{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;min-height:36px}
.modes button.on{background:var(--ink);color:var(--felt2)}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.score div{background:rgba(0,0,0,.22);border-radius:12px;padding:6px 8px;text-align:center}
.score b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.score small{font-size:12px;color:var(--mute)}
.table{background:rgba(0,0,0,.18);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:14px;box-shadow:inset 0 2px 18px rgba(0,0,0,.35)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--gold);color:#3a2a00}
.tag.p{background:#8fd3ff;color:#06314a}.tag.rg{background:#c9b6ff;color:#2a1660}
.q{font-size:17px;font-weight:700;margin:10px 0 4px;white-space:pre-line}
.groups{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:10px}
.grp{text-align:center}
.grp>small{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.cards{display:flex;gap:5px;justify-content:center}
.c{background:var(--card);color:var(--blk);position:relative;box-shadow:0 3px 0 rgba(0,0,0,.25),0 6px 12px rgba(0,0,0,.25);font-weight:800}
.c.r{color:var(--red)}
.c b{position:absolute;line-height:1.1}
.c i{position:absolute;bottom:0;font-style:normal;line-height:1.1}
.c.hl{outline:3px solid var(--gold);outline-offset:1px}
.c.in{animation:deal .25s ease-out both}
@keyframes deal{from{transform:translateY(-14px) rotate(-6deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.c.in{animation:none}}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choices.one{grid-template-columns:minmax(0,1fr)}
.ch{font:inherit;font-size:16px;font-weight:700;min-height:54px;border-radius:14px;border:2px solid transparent;background:var(--ink);color:#12301f;padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.ch:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.ch.ok{background:var(--ok);color:#06210f}
.ch.bad{background:var(--bad);color:#fff}
.ch.dim{opacity:.45}
.ch.sel{outline:4px solid var(--gold);outline-offset:2px}
.vbtn{font:inherit;font-size:14px;font-weight:800;border:2px solid rgba(255,255,255,.35);background:none;color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px}
.vbtn.on{background:var(--gold);border-color:var(--gold);color:#3a2a00}
.mic{display:none;align-items:center;gap:10px;background:rgba(0,0,0,.25);border-radius:14px;padding:8px 10px 8px 14px;font-size:15px}
.mic.show{display:flex}
.mic #micTxt{flex:1}
.mic button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;background:var(--ink);color:#12301f;padding:8px 16px;min-height:44px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mute);flex:none}
.dot.listen{background:#ff5a5a;animation:pulse 1s infinite}.dot.talk{background:#8fd3ff}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
@media (prefers-reduced-motion:reduce){.dot.listen{animation:none}}

.ch:disabled{cursor:default}
.fb{background:var(--card);color:#1d2a22;border-radius:16px;padding:12px 14px;display:none}
.fb.show{display:block}
.fb h2{font-size:18px;margin:0 0 6px}
.fb h2.ok{color:#178a46}.fb h2.bad{color:#c22d2d}
.fb p{margin:0;white-space:pre-line;font-size:15px}
.fb .cs{font-weight:800}
.fb .cs .r{color:var(--red)}
.next{font:inherit;font-weight:800;font-size:17px;min-height:54px;border:0;border-radius:14px;background:var(--gold);color:#3a2a00;display:none;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.next.show{display:block}
.play,.side{display:flex;flex-direction:column;gap:12px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);gap:8px;flex-wrap:wrap}
.foot button{font:inherit;font-size:13px;background:none;border:1px solid rgba(255,255,255,.3);color:var(--mute);border-radius:999px;padding:6px 12px;min-height:34px}
.foot .ver{opacity:.7}
/* 탭, 노트, 오답노트 */
.view{display:flex;flex-direction:column;gap:12px}.view[hidden]{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs button{font:inherit;font-weight:800;font-size:15px;min-height:46px;border-radius:12px;border:0;background:rgba(0,0,0,.25);color:var(--mute)}
.tabs button.on{background:var(--ink);color:#12301f}
.tabs b{display:inline-block;min-width:1.6em;padding:0 .4em;border-radius:999px;background:var(--bad);color:#fff;font-size:.85em}
.tabs b:empty{display:none}
.paper{background:var(--card);color:#1d2a22;border-radius:16px;padding:14px 16px}
.paper h2{margin:0 0 4px;font-size:19px}.paper h3{margin:14px 0 4px;font-size:16px;color:#0f5a3c}
.paper p{margin:0;white-space:pre-line;font-size:15px}
.paper .cs{font-weight:800}.paper .r{color:var(--red)}
.paper table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.paper th,.paper td{border-bottom:1px solid #dde5df;padding:6px 8px;text-align:left;vertical-align:top}
.paper th{background:#eef4f0;font-size:13px;white-space:nowrap}
.paper td.nw{white-space:nowrap}
.tscroll{overflow-x:auto}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.secnav a{flex:none;color:var(--ink);text-decoration:none;font-size:14px;font-weight:700;background:rgba(0,0,0,.25);border-radius:999px;padding:8px 12px}
details.paper>summary{font-weight:800;font-size:19px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:30px}
details.paper>summary::after{content:'+';font-size:22px;color:#0f5a3c}details.paper[open]>summary::after{content:'−'}
.wq .meta{font-size:13px;color:#5b6d62}.wq .q2{font-weight:700;margin:4px 0;white-space:pre-line}
.wq .mini{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0;font-weight:800}
.wq .ans{font-size:15px}.wq .ans .bad{color:#c22d2d;font-weight:700}.wq .ans .ok{color:#178a46;font-weight:700}
.wq .row{display:flex;gap:8px;margin-top:10px}
.wq .row button,.wtop button{white-space:nowrap;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;min-height:44px;padding:0 14px}
.wq .retry{background:#0f5a3c;color:#fff;flex:1}.wq .del{background:#e8ece9;color:#3a4a40}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink)}
.wtop button{background:rgba(0,0,0,.25);color:var(--ink)}.wtop button.warn{background:var(--bad);color:#fff}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.retryTag{background:var(--bad);color:#fff;margin-left:6px}
@media (min-width:560px){.tabs button{font-size:clamp(15px,2.3vw,22px);min-height:clamp(46px,6.5vw,64px)}.paper p,.paper table{font-size:clamp(15px,2.2vw,19px)}.paper h2,details.paper>summary{font-size:clamp(19px,3vw,26px)}}
/* 기록 탭 */
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 12px;margin-top:8px}
.frm label,.memo{display:flex;flex-direction:column;font-size:13px;font-weight:700;color:#3a4a40;gap:4px}
.paper input,.paper select,.paper textarea{font:inherit;font-size:16px;border:1px solid #c9d4cc;border-radius:10px;padding:10px;background:#fff;color:#1d2a22;min-height:44px;width:100%}
.memo{margin-top:10px}
.tiltRow{margin-top:10px;font-size:13px;font-weight:700;color:#3a4a40}
.tilt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.tilt button{font:inherit;font-size:14px;font-weight:700;min-height:44px;border-radius:10px;border:1px solid #c9d4cc;background:#fff;color:#1d2a22}
.tilt button.on{background:#0f5a3c;color:#fff;border-color:#0f5a3c}
.save{font:inherit;font-weight:800;font-size:17px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--gold);color:#3a2a00;margin-top:12px}
.msg{min-height:1.2em;color:#178a46;font-weight:700;margin-top:6px!important}
.out{font-weight:700;margin-top:8px!important}.out .good{color:#178a46}.out .warn{color:#b8860b}.out .bad{color:#c22d2d}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.sumg div{background:#eef4f0;border-radius:10px;padding:8px;text-align:center}.sumg b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.sumg small{font-size:12px;color:#5b6d62}
.plus{color:#178a46}.minus{color:#c22d2d}
.sess{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sess .amt{font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sess button{font:inherit;font-size:13px;border:0;background:#e8ece9;border-radius:8px;min-height:36px;padding:0 10px;margin-top:6px}
.row2{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.row2 button{font:inherit;font-weight:700;border:0;border-radius:10px;min-height:44px;padding:0 14px;background:#0f5a3c;color:#fff}
.rgrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;margin-top:8px;max-width:560px}
.rgrid span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(7px,2.1vw,12px);font-weight:700;border-radius:3px;background:#e3e8e4;color:#6b7a70}
.rgrid span.in{background:#0f5a3c;color:#fff}
/* 카드 크기는 화면 폭에 비례 (--cw = 카드 너비) */
:root{--cw:46px}
@media (max-width:380px){:root{--cw:40px}.groups{gap:8px 12px}}
.c{width:var(--cw);height:calc(var(--cw)*1.43);border-radius:calc(var(--cw)*.14)}
.c b{font-size:calc(var(--cw)*.37);left:calc(var(--cw)*.1);top:calc(var(--cw)*.04)}
.c i{font-size:calc(var(--cw)*.56);right:calc(var(--cw)*.08)}
.cards{gap:calc(var(--cw)*.1)}
/* 태블릿 세로: 전부 화면 폭에 맞춰 키움 */
@media (min-width:560px) and (orientation:portrait){
 :root{--cw:clamp(64px,16vw,180px)}
 .groups.g3 .grp:nth-child(2){order:3;flex-basis:100%}
 .wrap{max-width:1100px;padding:clamp(16px,3vw,36px);gap:clamp(12px,2vw,22px)}
 h1{font-size:clamp(28px,5vw,48px)}
 .modes button,.vbtn{font-size:clamp(16px,2.4vw,24px);padding:.45em 1.1em;min-height:clamp(44px,6vw,64px)}
 .score b{font-size:clamp(24px,4.2vw,44px)}.score small{font-size:clamp(13px,1.9vw,19px)}
 .table{padding:clamp(18px,3vw,34px)}
 .tag{font-size:clamp(14px,2.1vw,21px);padding:.25em .9em}
 .q{font-size:clamp(20px,3.4vw,34px);margin-top:.6em}
 .groups{gap:clamp(14px,2.4vw,28px) clamp(24px,4vw,48px);margin-top:clamp(14px,2.4vw,28px)}
 .grp>small{font-size:clamp(14px,2.1vw,21px);margin-bottom:.4em}
 .c.hl{outline-width:5px;outline-offset:2px}
 .ch{font-size:clamp(18px,3vw,30px);min-height:clamp(64px,9vw,100px);border-radius:18px}
 .choices{gap:clamp(10px,1.6vw,18px)}
 .mic{font-size:clamp(16px,2.4vw,24px)}.mic button{font-size:inherit;min-height:clamp(44px,6vw,60px)}
 .fb{padding:clamp(16px,2.6vw,30px)}.fb h2{font-size:clamp(20px,3.2vw,32px)}.fb p{font-size:clamp(17px,2.5vw,26px)}
 .next{font-size:clamp(19px,3vw,30px);min-height:clamp(62px,8.5vw,96px)}
 .foot,.foot button{font-size:clamp(13px,1.9vw,19px)}
}
/* 태블릿 가로 (v1.1 그대로) */
@media (min-width:700px) and (orientation:landscape){
 :root{--cw:70px}
 .wrap{max-width:980px;padding:20px 28px 36px;gap:16px}
 h1{font-size:34px}
 .modes button{font-size:17px;padding:10px 22px;min-height:44px}
 .vbtn{font-size:17px;padding:10px 20px;min-height:44px}.mic{font-size:18px}
 .score b{font-size:28px}.score small{font-size:14px}
 .table{padding:22px 24px}
 .tag{font-size:15px;padding:4px 14px}
 .q{font-size:22px;margin-top:14px}
 .groups{gap:16px 34px;margin-top:18px}
 .grp>small{font-size:15px}
 .cards{gap:8px}
 .ch{font-size:20px;min-height:68px;border-radius:16px}
 .choices{gap:12px}
 .fb{padding:18px 22px}.fb h2{font-size:22px}.fb p{font-size:18px}
 .next{font-size:20px;min-height:66px}
 .foot{font-size:15px}
}
@media (min-width:1000px) and (orientation:landscape){
 .wrap{max-width:1400px}
 .play{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
 .table{position:sticky;top:16px}
 .choices{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>홀덤 <span>퀴즈</span></h1>
    <button class="vbtn" id="voiceBtn" hidden>음성 모드</button>
    <div class="modes" id="modes">
      <button data-m="all" class="on">전체</button>
      <button data-m="basic">기초</button>
      <button data-m="prob">확률</button>
      <button data-m="range">레인지</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="quiz" class="on">퀴즈</button>
    <button data-v="notes">학습 노트</button>
    <button data-v="wrong">오답노트 <b id="wrongCount"></b></button>
    <button data-v="log">기록</button>
  </nav>
  <div id="vQuiz" class="view">
  <div class="score">
    <div><b id="sScore">0/0</b><small>정답</small></div>
    <div><b id="sRate">-</b><small>정답률</small></div>
    <div><b id="sStreak">0</b><small>연속</small></div>
    <div><b id="sBest">0</b><small>최고 연속</small></div>
  </div>
  <div class="play">
  <section class="table">
    <span class="tag" id="tag"></span>
    <div class="q" id="prompt"></div>
    <div class="groups" id="groups"></div>
  </section>
  <div class="side">
  <div class="choices" id="choices"></div>
  <div class="mic" id="mic"><span class="dot" id="micDot"></span><span id="micTxt">음성 모드</span><button id="micBtn">말하기</button></div>
  <div class="fb" id="fb"><h2 id="fbTitle"></h2><p id="fbText"></p></div>
  <button class="next" id="next">다음 문제</button>
  </div>
  </div>
  <div class="foot"><span id="kindStat"></span><span class="ver">v1.5.1</span><button id="reset">점수 초기화</button></div>
  </div>
  <div id="vNotes" class="view" hidden></div>
  <div id="vWrong" class="view" hidden></div>
  <div id="vLog" class="view" hidden>
    <div class="paper">
      <h2>뱅크롤 점검</h2>
      <div class="frm">
        <label>현재 뱅크롤<input id="bkAmt" type="number" inputmode="decimal" min="0"></label>
        <label>한 번 바이인<input id="bkBuy" type="number" inputmode="decimal" min="0"></label>
        <label>게임<select id="bkType"><option value="cash">캐시 게임</option><option value="mtt">토너먼트</option></select></label>
      </div>
      <p id="bkOut" class="out"></p>
    </div>
    <div class="paper">
      <h2>세션 기록하기</h2>
      <div class="frm">
        <label>날짜<input id="lgDate" type="date"></label>
        <label>게임<select id="lgType"><option value="cash">캐시 게임</option><option value="mtt">토너먼트</option></select></label>
        <label>스테이크·장소<input id="lgStake" type="text" placeholder="예: 1/2 홈게임"></label>
        <label>들어간 돈 (바이인 합계)<input id="lgIn" type="number" inputmode="decimal" min="0"></label>
        <label>가지고 나온 돈<input id="lgOut" type="number" inputmode="decimal" min="0"></label>
        <label>플레이 시간 (시간)<input id="lgHrs" type="number" inputmode="decimal" min="0" step="0.5"></label>
      </div>
      <div class="tiltRow"><span>틸트 정도</span><div id="lgTilt" class="tilt"><button data-t="1">1 평온</button><button data-t="2">2</button><button data-t="3">3</button><button data-t="4">4</button><button data-t="5">5 폭발</button></div></div>
      <label class="memo">메모 (잘한 점, 실수, 감정)<textarea id="lgMemo" rows="2"></textarea></label>
      <button id="lgSave" class="save">기록 저장</button>
      <p id="lgMsg" class="msg"></p>
    </div>
    <div class="paper" id="lgSum"></div>
    <div id="lgList"></div>
    <details class="paper"><summary>백업과 복원</summary>
      <p>기록은 이 기기에만 저장돼요. 기기를 바꾸기 전에 백업 내용을 복사해 메모 앱 등에 보관하세요.</p>
      <div class="row2"><button id="bkCopy">백업 내용 만들기</button><button id="bkLoad">붙여넣은 내용으로 복원</button></div>
      <textarea id="bkText" rows="4" placeholder="여기에 백업 내용이 나오거나, 복원할 내용을 붙여넣어요"></textarea>
      <p id="bkMsg" class="msg"></p>
    </details>
  </div>

const TL={3:'트리플(셋) 이상',4:'스트레이트 이상',5:'플러시 이상'};
const NEXTC=nb=>nb===3?'턴 카드 한 장':'리버 카드 한 장';
function isHit(hole,board,target){return ev(join(hole,board)).cat>=target}
function scenario(nb){
  for(let t=0;t<20000;t++){
    let hole;
    if(Math.random()<.5){const s=rnd(4),r1=rnd(13);let r2;do r2=rnd(13);while(r2===r1);hole=[r1*4+s,r2*4+s]}
    else hole=draw(2);
    const board=draw(nb,hole),known=join(hole,board),cur=ev(known),rest=deck(known);
    const pp=(hole[0]>>2)===(hole[1]>>2);
    for(const target of [3,4,5]){
      if(target===3&&!pp)continue;
      if(cur.cat>=target)continue;
      // 보드만으로 족보가 완성되는 카드가 있으면 아웃츠 정의가 애매해지므로 이런 상황은 출제하지 않음
      if(rest.some(c=>ev(join(board,[c])).cat>=target))continue;
      const outs=rest.filter(c=>isHit(hole,join(board,[c]),target));
      if(outs.length<2)continue;
      const t2=Math.min(...outs.map(c=>ev(join(hole,board,[c])).cat));
      return{hole,board,target:Math.max(target,Math.min(t2,5)),outs,rest};
    }
  }
}
const scnGroups=s=>[{label:'내 핸드',cards:s.hole},{label:s.board.length===3?'플랍':'플랍 + 턴',cards:s.board}];

function genOuts(){

    groups:scnGroups(s),
    explain:'아웃츠 '+n+'장\n'+outsTxt(s.outs)+'\n\n남은 '+s.rest.length+'장 중 '+n+'장이므로 다음 한 장에 완성될 확률은 '+pct(n/s.rest.length)+'입니다.\n상대 패는 고려하지 않았습니다.\n참고: 플러시 드로우 9장, 양방 스트레이트 드로우 8장, 거트샷 4장, 포켓 페어로 셋 2장.'},
    String(n),nearInts(n,1));
}
function riverHits(s){
  const r=s.rest;let hit=0,tot=0;
  for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){tot++;if(isHit(s.hole,join(s.board,[r[i],r[j]]),s.target))hit++}
  return{hit,tot};
}
function genHit(){
  const nb=Math.random()<.55?3:4,s=scenario(nb),n=s.outs.length,R=s.rest.length;
  const two=nb===3&&Math.random()<.6;
  let p,ex,cands;
  if(two){
    const h=riverHits(s);p=h.hit/h.tot;const byOuts=1-comb(R-n,2)/comb(R,2);
    ex='턴·리버 두 장 조합 '+h.tot+'가지를 모두 따지면 '+h.hit+'가지에서 완성 → '+pct(p)+'\n\n아웃츠 '+n+'장으로 계산: 1 − C('+(R-n)+',2)/C('+R+',2) = '+pct(byOuts)+'\n어림셈(4의 법칙): '+n+' × 4 ≈ '+n*4+'%';
    if(Math.abs(byOuts-p)>0.0005)ex+='\n\n정확한 값이 조금 더 큰 건 턴·리버 두 장이 모두 맞아야 완성되는 경우(러너-러너)까지 셌기 때문입니다.';
    cands=[n/R,n*0.04,2*n/R,byOuts+0.06];
  }else{
    p=n/R;
    ex='아웃츠 '+n+'장 / 남은 카드 '+R+'장 = '+pct(p)+'\n어림셈(2의 법칙): '+n+' × 2 ≈ '+n*2+'%\n\n'+outsTxt(s.outs);
    cands=[n/52,n*4/100,1-comb(R-n,2)/comb(R,2),n/(R-n)];
  }
  const what=two?'턴과 리버 두 장을 모두 봤을 때(리버까지) ':'다음에 나올 '+NEXTC(nb)+'으로 ';
  return pctQ({kind:'prob',type:'완성 확률',prompt:(nb===3?'플랍':'턴')+'입니다. '+what+josa(TL[s.target],'을','를')+' 완성할 확률은?',
    groups:scnGroups(s),explain:(two?'[턴 + 리버 두 장 기준]\n':'['+NEXTC(nb)+' 기준]\n')+ex,meta:{t:'hit',two,hole:s.hole,board:s.board,target:s.target}},p,cands,0.025);
}
function potBet(){const P=10*(2+rnd(29));const f=pick([0.25,1/3,0.5,2/3,0.75,1,1.5,2]);return{P,B:Math.max(5,Math.round(P*f/5)*5)}}

  const {P,B}=potBet(),req=B/(P+2*B);

function genCallFold(){

}
function equityFlop(a,b,f){
  const r=deck(join(a,b,f));let wa=0,wb=0,ti=0;
  for(let i=0;i<r.length;i++)for(let j=i+1;j<r.length;j++){
    const bd=join(f,[r[i],r[j]]);const x=ev(join(a,bd)).s,y=ev(join(b,bd)).s;
    if(x>y)wa++;else if(y>x)wb++;else ti++}
  const t=wa+wb+ti;return{wa,wb,ti,t};
}

  let a,b,f,r;
  for(let t=0;t<60;t++){const d=draw(7);a=d.slice(0,2);b=d.slice(2,4);f=d.slice(4);r=equityFlop(a,b,f);const w=r.wa/r.t;if(w>.04&&w<.96)break}

  return pctQ({kind:'prob',type:'승률 계산',prompt:'플랍까지 나왔습니다. 턴과 리버를 끝까지 볼 때 플레이어 A가 이길 확률(무승부 제외)은?',

  return mc({kind:'prob',type:'핸드 조합 수',prompt:'내 핸드와 플랍을 볼 때, 상대가 '+josa(label,'을','를')+' 들고 있을 수 있는 조합은 몇 가지일까요?',

  choices.forEach((c,i)=>{

  if(r.cmd==='stop'){setVoice(false);return}
  if(V.phase==='after'){
    if(r.cmd==='next'){next();return}
    if(r.cmd==='explain'||r.cmd==='repeat'){V.retries=0;vSpeak(spText(q.explain),vListen);return}
    retry('다음, 또는 해설이라고 말해 주세요.');return}
  if(r.cmd==='repeat'&&r.idx<0){askVoice();return}
  if(r.idx>=0){select(r.idx);V.retries=0}
  if(r.done&&V.sel>=0){choose(V.sel);return}
  if(r.done){retry('아직 고른 답이 없어요. 몇 번인지 말해 주세요.');return}
  if(r.idx>=0){vSpeak((r.idx+1)+'번, '+spText(q.choices[r.idx])+'. 맞으면 제출이라고 말하세요.',vListen);return}
  retry('잘 못 알아들었어요. 번호나 답을 말해 주세요.');
};
function setVoice(on){
  V.on=on;$('voiceBtn').classList.toggle('on',on);$('voiceBtn').textContent=on?'음성 모드 켜짐':'음성 모드';
  $('mic').classList.toggle('show',on);
  try{localStorage.setItem('hq-voice',on?'1':'0')}catch(e){}
  if(!on){vStop();select(-1);return}
  if(answered){V.phase='after';V.retries=0;vSpeak('다음 문제로 가려면 다음이라고 말하세요.',vListen)}else askVoice();
}
if(voiceOK){$('voiceBtn').hidden=false;$('voiceBtn').addEventListener('click',()=>setVoice(!V.on))}
$('micBtn').addEventListener('click',()=>{if(!V.on)return;V.retries=0;vStop();vListen()});
// ---- 오답노트
let wrong=[];try{wrong=JSON.parse(localStorage.getItem('hq-wrong'))||[]}catch(e){}
const saveWrong=()=>{try{localStorage.setItem('hq-wrong',JSON.stringify(wrong))}catch(e){}$('wrongCount').textContent=wrong.length||''};
const qKey=x=>x.prompt+'|'+JSON.stringify(x.groups.map(g=>g.cards))+'|'+x.choices.join('/');
function wrongRecord(ok,i){
  const k=qKey(q),idx=wrong.findIndex(w=>w.key===k);
  if(ok){if(q.retryId&&idx>=0){wrong.splice(idx,1);saveWrong();$('fbTitle').textContent='정답! 오답노트에서 뺐어요'}return}
  const item={key:k,kind:q.kind,type:q.type,prompt:q.prompt,groups:q.groups,choices:q.choices,answer:q.answer,hl:q.hl||null,explain:q.explain,picked:i,time:Date.now(),miss:1};
  if(idx>=0){item.miss=(wrong[idx].miss||1)+1;wrong.splice(idx,1)}
  wrong.unshift(item);if(wrong.length>300)wrong.length=300;saveWrong();
}
const cardTxt=cs=>'<span class="cs">'+cs.map(c=>isRed(c)?'<span class="r">'+ct(c)+'</span>':ct(c)).join(' ')+'</span>';
let clearArmed=false;
function renderWrong(){
  const v=$('vWrong');
  if(!wrong.length){v.innerHTML='<div class="empty">틀린 문제가 없어요. 퀴즈에서 틀리면 여기에 자동으로 모입니다.</div>';return}
  v.innerHTML='<div class="wtop"><span>틀린 문제 '+wrong.length+'개 · 다시 풀어서 맞히면 빠져요</span><button id="wClear" class="'+(clearArmed?'warn':'')+'">'+(clearArmed?'정말 모두 지울까요?':'모두 지우기')+'</button></div>'+
   wrong.map((w,n)=>'<div class="paper wq"><div class="meta">'+KIND_KO[w.kind]+' · '+esc(w.type)+' · '+new Date(w.time).toLocaleDateString('ko-KR')+(w.miss>1?' · '+w.miss+'번 틀림':'')+'</div>'+
     '<div class="q2">'+esc(w.prompt)+'</div>'+(w.groups.length?'<div class="mini">'+w.groups.map(g=>'<span>'+esc(g.label)+': '+cardTxt(g.cards)+'</span>').join('')+'</div>':'')+
     '<div class="ans">내 답: <span class="bad">'+esc(w.choices[w.picked])+'</span> · 정답: <span class="ok">'+esc(w.choices[w.answer])+'</span></div>'+
     '<details><summary>해설 보기</summary><p>'+fmtExplain(w.explain)+'</p></details>'+
     '<div class="row"><button class="retry" data-n="'+n+'">다시 풀기</button><button class="del" data-n="'+n+'">삭제</button></div></div>').join('');
}
$('vWrong').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='wClear'){if(clearArmed){wrong=[];saveWrong();clearArmed=false}else clearArmed=true;renderWrong();return}
  clearArmed=false;const w=wrong[+b.dataset.n];if(!w)return;
  if(b.classList.contains('del')){wrong.splice(+b.dataset.n,1);saveWrong();renderWrong();return}
  q={kind:w.kind,type:w.type,prompt:w.prompt,groups:w.groups,choices:w.choices,answer:w.answer,hl:w.hl,explain:w.explain,retryId:w.key};
  answered=false;setView('quiz');showQuestion();
});
// ---- 학습 노트 (notes.json)
let notes=null;
function loadNotes(){
  const v=$('vNotes');if(notes){renderNotes();return}
  v.innerHTML='<div class="empty">노트를 불러오는 중…</div>';
  const x=new XMLHttpRequest();x.open('GET','notes.json');x.overrideMimeType('application/json');
  x.onload=()=>{try{notes=JSON.parse(x.responseText);renderNotes()}catch(e){v.innerHTML='<div class="empty">노트 파일(notes.json)을 읽지 못했어요.</div>'}};
  x.onerror=()=>{v.innerHTML='<div class="empty">노트 파일(notes.json)을 찾지 못했어요.</div>'};x.send();
}
function rangeGrid(set){
  let h='<div class="rgrid">';
  for(let i=12;i>=0;i--)for(let j=12;j>=0;j--){const code=i===j?RK[i]+RK[i]:i>j?RK[i]+RK[j]+'s':RK[j]+RK[i]+'o';h+='<span class="'+(set.has(code)?'in':'')+'">'+code+'</span>'}
  return h+'</div><p style="font-size:13px;color:#5b6d62">위 오른쪽 삼각형은 수딧(s), 왼쪽 아래는 오프수트(o), 대각선은 포켓 페어. 진한 칸이 오픈. T는 10입니다.</p>';
}
function renderNotes(){
  const S=notes.sections||[];
  $('vNotes').innerHTML='<div class="secnav">'+S.map((s,i)=>'<a href="#" data-s="'+i+'">'+esc(s.title)+'</a>').join('')+'</div>'+
   S.map((s,i)=>'<details class="paper" id="ns'+i+'"'+(i===0?' open':'')+'><summary>'+esc(s.title)+'</summary>'+(s.items||[]).map(it=>
     '<h3>'+esc(it.h||'')+'</h3>'+(it.body?'<p>'+fmtExplain(it.body)+'</p>':'')+(it.grid&&RSET[it.grid]?rangeGrid(RSET[it.grid]):'')+
     (it.table?'<div class="tscroll"><table><thead><tr>'+it.table[0].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
       it.table.slice(1).map(r=>'<tr>'+r.map(c=>'<td'+(String(c).length<=12?' class="nw"':'')+'>'+fmtExplain(String(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'')).join('')+'</details>').join('');
}
$('vNotes').addEventListener('click',e=>{const a=e.target.closest('.secnav a');if(!a)return;e.preventDefault();const d=$('ns'+a.dataset.s);d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})});
// ---- 기록 (세션, 틸트, 뱅크롤)
let lg={sessions:[],bk:{}};try{const x=JSON.parse(localStorage.getItem('hq-log'));if(x&&x.sessions)lg=x}catch(e){}
const saveLog=()=>{try{localStorage.setItem('hq-log',JSON.stringify(lg))}catch(e){}};
const won=v=>(v<0?'−':'+')+Math.abs(Math.round(v)).toLocaleString('ko-KR');
let tiltSel=0;
function renderBk(){
  const a=+$('bkAmt').value,b=+$('bkBuy').value,t=$('bkType').value;lg.bk={a:$('bkAmt').value,b:$('bkBuy').value,t};saveLog();
  if(!a||!b){$('bkOut').innerHTML='뱅크롤과 바이인 금액을 넣으면 몇 바이인인지 계산해 드려요.';return}
  const n=a/b,need=t==='cash'?[20,30]:[50,100];
  const cls=n>=need[1]?'good':n>=need[0]?'warn':'bad';
  $('bkOut').innerHTML='<span class="'+cls+'">바이인 '+(Math.round(n*10)/10)+'개</span> · 권장 '+(t==='cash'?'캐시 게임 최소 20개, 넉넉하게 30개 이상':'토너먼트 최소 50개, 넉넉하게 100개 이상')+
    (cls==='bad'?'<br>지금 스테이크는 부담이 커요. 한 단계 낮은 스테이크를 고려해 보세요.':cls==='warn'?'<br>버틸 수는 있지만 연패가 오면 스테이크를 낮추세요.':'<br>지금 스테이크에서 안정적으로 플레이할 수 있어요.');
}
function renderLog(){
  if(lg.bk&&!$('bkAmt').value){$('bkAmt').value=lg.bk.a||'';$('bkBuy').value=lg.bk.b||'';$('bkType').value=lg.bk.t||'cash'}
  if(!$('lgDate').value)$('lgDate').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  renderBk();
  const S=lg.sessions,tot=S.reduce((a,x)=>a+x.out-x.in,0),hrs=S.reduce((a,x)=>a+(+x.hrs||0),0);
  const tc=S.filter(x=>x.tilt),avgT=tc.length?tc.reduce((a,x)=>a+x.tilt,0)/tc.length:0;
  const calm=S.filter(x=>x.tilt&&x.tilt<=2),hot=S.filter(x=>x.tilt>=4);
  const avg=a=>a.length?a.reduce((n,x)=>n+x.out-x.in,0)/a.length:null;
  const cls=v=>v>=0?'plus':'minus';
  $('lgSum').innerHTML='<h2>요약</h2>'+(S.length?'<div class="sumg">'+
    '<div><b class="'+cls(tot)+'">'+won(tot)+'</b><small>총 손익</small></div>'+
    '<div><b>'+S.length+'</b><small>세션</small></div>'+
    '<div><b>'+(Math.round(hrs*10)/10)+'</b><small>총 시간</small></div>'+
    '<div><b class="'+cls(tot)+'">'+(hrs?won(tot/hrs):'-')+'</b><small>시간당</small></div>'+
    '<div><b>'+(avgT?avgT.toFixed(1):'-')+'</b><small>평균 틸트</small></div>'+
    '<div><b>'+S.filter(x=>x.out>x.in).length+'/'+S.length+'</b><small>이긴 세션</small></div></div>'+
    (calm.length&&hot.length?'<p style="margin-top:10px">평온할 때(틸트 1~2) 세션당 <b class="'+cls(avg(calm))+'">'+won(avg(calm))+'</b>, 흥분했을 때(4~5) 세션당 <b class="'+cls(avg(hot))+'">'+won(avg(hot))+'</b></p>':'<p style="margin-top:10px">틸트 정도를 꾸준히 적으면 평온할 때와 흥분했을 때의 손익을 비교해 드려요.</p>')
    :'<p>아직 기록이 없어요. 세션이 끝나면 위에 적어 주세요.</p>');
  $('lgList').innerHTML=S.map((x,n)=>'<div class="paper sess"><div><b>'+esc(x.date)+'</b> · '+(x.type==='mtt'?'토너먼트':'캐시')+(x.stake?' · '+esc(x.stake):'')+
    '<br><small>'+(x.hrs?x.hrs+'시간 · ':'')+(x.tilt?'틸트 '+x.tilt:'')+'</small>'+(x.memo?'<p style="font-size:14px;margin-top:4px">'+esc(x.memo)+'</p>':'')+
    '</div><div style="text-align:right"><div class="amt '+cls(x.out-x.in)+'">'+won(x.out-x.in)+'</div><button data-del="'+n+'">삭제</button></div></div>').join('');
}
['bkAmt','bkBuy','bkType'].forEach(id=>$(id).addEventListener('input',renderBk));
$('lgTilt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tiltSel=+b.dataset.t;document.querySelectorAll('#lgTilt button').forEach(x=>x.classList.toggle('on',x===b))});
$('lgSave').addEventListener('click',()=>{
  const inn=parseFloat($('lgIn').value),out=parseFloat($('lgOut').value);
  if(isNaN(inn)||isNaN(out)){$('lgMsg').style.color='#c22d2d';$('lgMsg').textContent='들어간 돈과 가지고 나온 돈을 입력해 주세요.';return}
  lg.sessions.unshift({date:$('lgDate').value,type:$('lgType').value,stake:$('lgStake').value.trim(),in:inn,out,hrs:parseFloat($('lgHrs').value)||0,tilt:tiltSel,memo:$('lgMemo').value.trim(),time:Date.now()});
  saveLog();['lgIn','lgOut','lgHrs','lgMemo'].forEach(id=>$(id).value='');tiltSel=0;document.querySelectorAll('#lgTilt button').forEach(x=>x.classList.remove('on'));
  $('lgMsg').style.color='';$('lgMsg').textContent='저장했어요. 수고하셨어요!';renderLog();setTimeout(()=>$('lgMsg').textContent='',3000);
});
$('lgList').addEventListener('click',e=>{const b=e.target.closest('button[data-del]');if(!b)return;
  if(b.dataset.armed){lg.sessions.splice(+b.dataset.del,1);saveLog();renderLog()}else{b.dataset.armed='1';b.textContent='정말 삭제?';b.style.background='#ee5a5a';b.style.color='#fff'}});
$('bkCopy').addEventListener('click',()=>{const t=JSON.stringify({log:lg,wrong,stats:st});$('bkText').value=t;$('bkText').select();
  try{navigator.clipboard.writeText(t).then(()=>$('bkMsg').textContent='복사했어요. 메모 앱 등에 붙여넣어 보관하세요.',()=>$('bkMsg').textContent='위 내용을 길게 눌러 복사하세요.')}catch(e){$('bkMsg').textContent='위 내용을 길게 눌러 복사하세요.'}});
$('bkLoad').addEventListener('click',()=>{try{const x=JSON.parse($('bkText').value);if(!x.log||!x.log.sessions)throw 0;lg=x.log;saveLog();if(Array.isArray(x.wrong)){wrong=x.wrong;saveWrong()}if(x.stats&&x.stats.k){st=x.stats;if(!st.k.range)st.k.range=[0,0];save();renderScore()}
  $('bkMsg').style.color='';$('bkMsg').textContent='복원했어요.';$('bkAmt').value='';renderLog()}catch(e){$('bkMsg').style.color='#c22d2d';$('bkMsg').textContent='백업 내용이 올바르지 않아요.'}});
// ---- 화면 전환
let view='quiz';
function setView(v){
  view=v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('vQuiz').hidden=v!=='quiz';$('vNotes').hidden=v!=='notes';$('vWrong').hidden=v!=='wrong';$('vLog').hidden=v!=='log';
  if(v==='log')renderLog();
  $('modes').style.display=v==='quiz'?'':'none';
  if(v!=='quiz'&&V.on){vStop();micState('퀴즈 화면으로 돌아오면 말하기 버튼을 눌러 주세요')}
  if(v==='notes')loadNotes();if(v==='wrong'){clearArmed=false;renderWrong()}
  window.scrollTo({top:0});
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v)});
saveWrong();
$('choices').addEventListener('click',e=>{const b=e.target.closest('.ch');if(b)choose(+b.dataset.i)});
$('next').addEventListener('click',next);
$('modes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;save();renderScore();next()});
$('reset').addEventListener('click',()=>{st={c:0,t:0,streak:0,best:0,k:{basic:[0,0],prob:[0,0],range:[0,0]}};save();renderScore()});
document.addEventListener('keydown',e=>{if(view!=='quiz')return;if(e.key>='1'&&e.key<='4')choose(+e.key-1);else if((e.key==='Enter'||e.key===' ')&&answered){e.preventDefault();next()}});
renderScore();next();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()})}
}
}
</script>
